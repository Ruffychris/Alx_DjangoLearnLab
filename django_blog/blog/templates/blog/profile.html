{% extends 'blog/base.html' %}

{% block content %}

<h2>Profile</h2>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Update</button>
</form>

<br>

<a href="{% url 'logout' %}">Logout</a>

{% for message in messages %}
<p>{{ message }}</p>
{% endfor %}

{% endblock %}
